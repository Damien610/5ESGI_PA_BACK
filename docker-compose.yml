services:
  db_dev:
    image: postgres:15
    container_name: postgres_dev
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - appnet_dev

  pgadmin_dev:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db_dev
    networks:
      - appnet_dev

  minio-dev:
    image: minio/minio:latest
    container_name: minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    networks:
      - appnet_dev

  createbucket-dev:
    image: minio/mc
    container_name: minio-createbucket-dev
    depends_on:
      - minio-dev
    entrypoint: |
      /bin/sh -c "
      sleep 5
      mc alias set local http://minio-dev:9000 minioadmin minioadmin
      mc mb --ignore-existing local/uploads
      mc anonymous set download local/uploads
      mc ls local/uploads
      exit 0
      "
    networks:
      - appnet_dev

  api_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_projet_dev
    depends_on:
      - db_dev
      - minio-dev
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    volumes:
      - .:/app
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - appnet_dev

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  appnet_dev:
    driver: bridge
