services:
  db_dev:
    image: postgres:15
    container_name: postgres_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-app_db_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - appnet_dev

  pgadmin_dev:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db_dev
    networks:
      - appnet_dev
    profiles:
      - dev-tools

  minio-dev:
    image: minio/minio:latest
    container_name: minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    networks:
      - appnet_dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbucket-dev:
    image: minio/mc
    container_name: minio-createbucket-dev
    depends_on:
      minio-dev:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      sleep 5
      mc alias set local http://minio-dev:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}
      mc mb --ignore-existing local/uploads
      mc anonymous set download local/uploads
      mc ls local/uploads
      exit 0
      "
    networks:
      - appnet_dev

  api_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_projet_dev
    depends_on:
      db_dev:
        condition: service_started
      minio-dev:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Database
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-app_db_dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-db_dev}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Security
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      # SMTP
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio-dev:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
    volumes:
      - .:/app
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - appnet_dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  appnet_dev:
    driver: bridge
