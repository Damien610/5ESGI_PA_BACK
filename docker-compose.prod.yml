services:
  db_prod:
    image: postgres:15
    container_name: postgres_prod
    env_file:
      - .env.prod
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - appnet_prod
    restart: unless-stopped

  minio-prod:
    image: minio/minio:latest
    container_name: minio-prod
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    networks:
      - appnet_prod
    restart: unless-stopped

  createbucket-prod:
    image: minio/mc
    container_name: minio-createbucket-prod
    depends_on:
      - minio-prod
    entrypoint: |
      /bin/sh -c "
      sleep 5
      mc alias set local http://minio-prod:9000 minioadmin minioadmin
      mc mb --ignore-existing local/uploads
      mc anonymous set download local/uploads
      mc ls local/uploads
      exit 0
      "
    networks:
      - appnet_prod

  api_prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fastapi_projet_prod
    depends_on:
      - db_prod
      - minio-prod
    env_file:
      - .env.prod
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    networks:
      - appnet_prod
    restart: unless-stopped

volumes:
  postgres_data_prod:
  minio_data_prod:

networks:
  appnet_prod:
    driver: bridge
